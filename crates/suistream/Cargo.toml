[package]
name = "suistream"
version = "0.1.0"
description = "Client for the Sui checkpoint SSE stream (ordered, resumable, server-side history)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
futures.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "zstd", "gzip"] }
serde.workspace = true
serde_json.workspace = true
# crates.io (not the gateway's git pin): the SDK must stay publishable.
sui-rpc = "0.4.0"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
axum.workspace = true
flate2 = "1"
zstd.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
